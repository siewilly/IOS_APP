name: Live2DChatApp
options:
  bundleIdPrefix: com.live2d
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

targets:
  Live2DChatApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Live2DChatApp
        excludes:
          - "Resources/WebEngine"
          - "Resources/WebEngine/**"
          - "Info.plist"
      - path: Live2DChatApp/Resources/WebEngine
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.live2d.Live2DChatApp
        PRODUCT_NAME: Live2DChatApp
        INFOPLIST_FILE: Live2DChatApp/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
